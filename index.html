<!DOCTYPE html>
<html lang="en">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #d4466a;
            --primary-deep: #b8304f;
            --primary-soft: #f2c4ce;
            --gold: #c9a84c;
            --gold-light: #e8d48b;
            --gold-dim: rgba(201, 168, 76, 0.15);
            --dark-bg: #0c0c14;
            --card-bg: #121220;
            --surface: #16162a;
            --text-primary: #eeeef0;
            --text-secondary: rgba(238, 238, 240, 0.55);
            --text-muted: rgba(238, 238, 240, 0.25);
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.07);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        /* ========== CANVAS ========== */
        #particles-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ========== SCROLL PROGRESS ========== */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--gold));
            z-index: 9999;
            transition: width 0.05s linear;
        }

        /* ============================================
           LANDING SCREEN
        ============================================ */
        #landing-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            background: radial-gradient(ellipse at 50% 40%, #1a1028 0%, var(--dark-bg) 70%);
            transition: opacity 1s cubic-bezier(.4,0,.2,1), transform 1s cubic-bezier(.4,0,.2,1);
        }

        #landing-screen.hidden {
            opacity: 0;
            transform: scale(1.04);
            pointer-events: none;
        }

        .landing-hearts {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .floating-heart {
            position: absolute;
            animation: floatHeart linear infinite;
            opacity: 0;
        }

        @keyframes floatHeart {
            0%   { transform: translateY(100vh) rotate(0deg) scale(.5); opacity:0; }
            8%   { opacity:.25; }
            85%  { opacity:.2; }
            100% { transform: translateY(-80px) rotate(540deg) scale(1); opacity:0; }
        }

        .landing-content {
            text-align: center;
            z-index: 2;
            position: relative;
            padding: 0 24px;
        }

        .landing-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 40px rgba(212, 70, 106, 0.3);
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-8px); }
        }

        .landing-overline {
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 16px;
            opacity: 0.8;
        }

        .landing-title {
            font-family: 'Great Vibes', cursive;
            font-size: 76px;
            font-weight: 400;
            line-height: 1.15;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 40%, #dfc06e 70%, var(--gold-light) 100%);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: goldShimmer 4s ease-in-out infinite;
        }

        @keyframes goldShimmer {
            0%,100% { background-position: 0% center; }
            50%     { background-position: 100% center; }
        }

        .landing-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-weight: 400;

            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .landing-date {
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 52px;
        }

        /* CTA Button */
        .plan-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 48px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            overflow: hidden;
            transition: all .45s cubic-bezier(.4,0,.2,1);
            box-shadow:
                0 4px 24px rgba(212, 70, 106, 0.25),
                inset 0 1px 0 rgba(255,255,255,0.12);
        }

        .plan-button::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: translateX(-100%);
            transition: transform .6s ease;
        }

        .plan-button:hover::after { transform: translateX(100%); }

        .plan-button:hover {
            transform: translateY(-3px);
            box-shadow:
                0 8px 36px rgba(212, 70, 106, 0.35),
                inset 0 1px 0 rgba(255,255,255,0.15);
        }

        .plan-button:active { transform: translateY(-1px) scale(.99); }

        .plan-button .material-symbols-outlined {
            font-size: 20px;
            font-variation-settings: 'FILL' 1;
        }

        /* ============================================
           MAIN SCREEN
        ============================================ */
        #main-screen {
            display: none;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        #main-screen.visible {
            display: block;
            animation: screenFadeIn 1s ease;
        }

        @keyframes screenFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 500;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all .3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:hover {
            background: rgba(212,70,106,0.12);
            border-color: rgba(212,70,106,0.2);
            color: var(--primary-soft);
            transform: scale(1.08);
        }

        /* Header */
        .header {
            text-align: center;
            padding: 72px 24px 32px;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;

            border: 1px solid rgba(201,168,76,0.15);

        .header-badge .material-symbols-outlined {

            font-variation-settings: 'FILL' 1;
        }

        .header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 60px;
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), #dfc06e);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: goldShimmer 4s ease-in-out infinite;
        }

        .header-divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 16px;
        }

        .header-quote {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            font-weight: 400;
            font-style: italic;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            max-width: 420px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .countdown-chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 28px;
            padding: 10px 24px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .countdown-chip .material-symbols-outlined {
            font-size: 18px;
            color: var(--gold);
            font-variation-settings: 'FILL' 1;
        }

        .countdown-chip span {
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
        }

        .countdown-chip strong {
            color: var(--gold);
            font-weight: 600;
        }

        /* ============================================
           TIMELINE
        ============================================ */
        .timeline-wrapper {
            max-width: 860px;
            margin: 0 auto;
            padding: 48px 24px 100px;
            position: relative;
        }

        .timeline-track {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255,255,255,0.04);
            transform: translateX(-50%);
        }

        .timeline-track::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--primary) 0%, var(--gold) 50%, var(--primary) 100%);
            opacity: 0.2;
            animation: trackPulse 4s ease-in-out infinite;
        }

        @keyframes trackPulse {
            0%,100% { opacity: 0.15; }
            50%     { opacity: 0.35; }
        }

        /* Day Label */
        .day-label {
            text-align: center;
            position: relative;
            z-index: 3;
            margin: 24px 0 36px;
        }

        .day-label-inner {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 24px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
        }

        .day-label-inner .material-symbols-outlined {
            font-size: 16px;
            font-variation-settings: 'FILL' 1;
        }

        /* Night Block */
        .night-block {
            text-align: center;
            position: relative;
            z-index: 3;
            margin: 40px 0;
        }

        .night-block-inner {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 20px 36px;
            background: linear-gradient(135deg, rgba(12,12,20,0.9), rgba(22,22,42,0.8));
            border: 1px solid rgba(201,168,76,0.1);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(12px);
        }

        .night-block-inner .moon { font-size: 28px; }
        .night-block-inner .night-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            font-style: italic;
        }
        .night-block-inner .night-sub {
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* Timeline Item */
        .tl-item {
            position: relative;
            margin-bottom: 48px;
            display: flex;
            align-items: flex-start;
            opacity: 0;
            animation: itemAppear .6s ease forwards;
        }

        @keyframes itemAppear { to { opacity: 1; } }

        .tl-item:nth-child(odd) {
            flex-direction: row;
            padding-right: calc(50% + 36px);
        }
        .tl-item:nth-child(odd) .tl-card { text-align: right; }

        .tl-item:nth-child(even) {
            flex-direction: row-reverse;
            padding-left: calc(50% + 36px);
        }
        .tl-item:nth-child(even) .tl-card { text-align: left; }

        /* Timeline Dot */
        .tl-dot {
            position: absolute;
            left: 50%;
            top: 28px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            transform: translateX(-50%);
            z-index: 4;
            transition: all .5s ease;
        }

        .tl-dot.is-locked {
            background: var(--surface);
            border: 2px solid rgba(255,255,255,0.08);
            box-shadow: 0 0 0 4px rgba(0,0,0,0.3);
        }

        .tl-dot.is-unlocked {
            background: var(--primary);
            border: 2px solid var(--gold);
            box-shadow:
                0 0 12px rgba(212,70,106,0.4),
                0 0 0 4px rgba(212,70,106,0.1);
            animation: dotGlow 2.5s ease-in-out infinite;
        }

        @keyframes dotGlow {
            0%,100% { box-shadow: 0 0 12px rgba(212,70,106,0.4), 0 0 0 4px rgba(212,70,106,0.1); }
            50%     { box-shadow: 0 0 20px rgba(212,70,106,0.6), 0 0 0 6px rgba(212,70,106,0.15); }
        }

        /* Timeline Card */
        .tl-card {
            width: 100%;
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all .5s cubic-bezier(.4,0,.2,1);
        }

        .tl-card.is-locked {
            background: var(--glass);
            border: 1px solid var(--glass-border);
        }

        .tl-card.is-unlocked {
            background: linear-gradient(135deg, rgba(212,70,106,0.06), rgba(201,168,76,0.03));
            border: 1px solid rgba(212,70,106,0.1);
            box-shadow: 0 8px 40px rgba(0,0,0,0.25);
        }

        .tl-card.is-unlocked:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 56px rgba(0,0,0,0.35);
            border-color: rgba(212,70,106,0.18);
        }

        /* Card Content – Unlocked */
        .card-content {
            padding: 28px;
            animation: cardReveal .8s ease;
        }

        @keyframes cardReveal {
            from { opacity: 0; filter: blur(6px); transform: scale(.96); }
            to   { opacity: 1; filter: blur(0);   transform: scale(1); }
        }

        .card-emoji {
            font-size: 38px;
            margin-bottom: 14px;
            display: block;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
        }

        .card-time {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 14px;
            background: var(--gold-dim);
            color: var(--gold);
            border: 1px solid rgba(201,168,76,0.12);
        }

        .card-time .material-symbols-outlined {
            font-size: 14px;
            font-variation-settings: 'FILL' 1;
        }

        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .card-desc {
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.75;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .card-note {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(212,70,106,0.06);
            border: 1px solid rgba(212,70,106,0.08);
            border-radius: var(--radius-sm);
            font-family: 'Cormorant Garamond', serif;
            font-size: 14px;
            font-style: italic;
            color: var(--primary-soft);
        }

        .card-note .material-symbols-outlined {
            font-size: 16px;
            color: var(--primary);
            font-variation-settings: 'FILL' 1;
        }

        /* Card Content – Locked */
        .card-locked {
            padding: 36px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center !important;
        }

        .lock-icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            animation: lockIdle 5s ease-in-out infinite;
        }

        @keyframes lockIdle {
            0%,85%,100% { transform: rotate(0); }
            88%  { transform: rotate(-4deg); }
            91%  { transform: rotate(4deg); }
            94%  { transform: rotate(-2deg); }
            97%  { transform: rotate(2deg); }
        }

        .lock-icon-wrap .material-symbols-outlined {
            font-size: 24px;
            color: var(--text-muted);
            font-variation-settings: 'FILL' 0, 'wght' 200;
        }

        .lock-msg {
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .lock-timer {
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: rgba(212,70,106,0.35);
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .lock-time-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px;
            border-radius: 20px;
            font-family: 'Outfit', sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.04);
        }

        .lock-time-badge .material-symbols-outlined {
            font-size: 13px;
        }

        /* ============================================
           TOAST
        ============================================ */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--primary-deep), var(--primary));
            color: #fff;
            border-radius: 60px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 500;
            z-index: 8000;
            opacity: 0;
            transition: all .5s cubic-bezier(.4,0,.2,1);
            box-shadow: 0 8px 32px rgba(212,70,106,0.35);
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast .material-symbols-outlined {
            font-size: 20px;
            font-variation-settings: 'FILL' 1;
        }

        /* ============================================
           RESPONSIVE
        ============================================ */
        @media (max-width: 768px) {
            .landing-title { font-size: 52px; }
            .landing-subtitle { font-size: 16px; letter-spacing: 2px; }
            .header h1 { font-size: 44px; }

            .timeline-track { left: 24px; }

            .tl-item:nth-child(odd),
            .tl-item:nth-child(even) {
                flex-direction: row;
                padding-right: 0;
                padding-left: 56px;
            }
            .tl-item:nth-child(odd) .tl-card,
            .tl-item:nth-child(even) .tl-card { text-align: left; }

            .tl-dot { left: 24px; }

            .timeline-wrapper { padding: 48px 16px 100px; }
            .card-content { padding: 22px; }
            .card-title { font-size: 20px; }

            .plan-button {
                padding: 16px 36px;
                font-size: 12px;
                letter-spacing: 2px;
            }

            .back-btn { top: 16px; left: 16px; width: 40px; height: 40px; }
        }

        @media (max-width: 480px) {
            .landing-title { font-size: 40px; }
            .landing-subtitle { font-size: 14px; }
            .landing-date { font-size: 11px; letter-spacing: 4px; }
            .header h1 { font-size: 36px; }
            .header-quote { font-size: 16px; }
            .landing-icon { width: 60px; height: 60px; font-size: 28px; }
        }
    </style>
</head>
<body>

<canvas id="particles-canvas"></canvas>
<div class="scroll-progress" id="scrollProgress"></div>

<!-- ===================== LANDING ===================== -->
<div id="landing-screen">
    <div class="landing-hearts" id="landingHearts"></div>
    <div class="landing-content">
        <div class="landing-icon">👑</div>
        <p class="landing-overline">A Royal Celebration</p>
        <h1 class="landing-title">Happy Birthday<br>Chweety</h1>
        <p class="landing-subtitle">✦ Crafted With Love ✦</p>
        <p class="landing-date">July 10 — 11, 2026</p>
        <button class="plan-button" onclick="enterPlan()">
            <span class="material-symbols-outlined">favorite</span>
            Chweety's Birthday Plan
        </button>
    </div>
</div>

<!-- ===================== MAIN ===================== -->
<div id="main-screen">
    <button class="back-btn" onclick="goBack()" title="Back">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>

    <div class="header">
        <div class="header-badge">
            <span class="material-symbols-outlined">cake</span>
            Birthday Itinerary
        </div>
        <h1>Happy Birthday Chweety</h1>
        <div class="header-divider"></div>
        <p class="header-quote">"Every moment today is a love letter written just for you."</p>
        <div class="countdown-chip">
            <span class="material-symbols-outlined">schedule</span>
            <span id="countdown-timer">Loading…</span>
        </div>
    </div>

    <div class="timeline-wrapper">
        <div class="timeline-track"></div>
        <div id="timeline-items"></div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
    <span class="material-symbols-outlined">auto_awesome</span>
    <span id="toast-text">A new surprise revealed!</span>
</div>

<script>
// ============================================
// ITINERARY CONFIG
// 10AM → 10PM (July 10) = 2hr gaps, 7 slots
// 10PM → skip night → 7AM (July 11) = 1 slot
// ============================================
const itinerary = [
    { time:'10:00 AM', day:10, hour:10, emoji:'🌅', title:'Morning Surprise', desc:'Placeholder: The day begins with something truly special…', note:'The start of your magical day' },
    { time:'12:00 PM', day:10, hour:12, emoji:'🥂', title:'Midday Celebration', desc:'Placeholder: A wonderful midday moment crafted for you…', note:'A toast to the birthday queen' },
    { time:'2:00 PM', day:10, hour:14, emoji:'🎁', title:'Gift Unwrapping', desc:'Placeholder: A heartfelt surprise awaits you at this hour…', note:'Wrapped with all my love' },
    { time:'4:00 PM', day:10, hour:16, emoji:'🎭', title:'Adventure Hour', desc:'Placeholder: Something fun and exciting is planned…', note:'Making memories together' },
    { time:'6:00 PM', day:10, hour:18, emoji:'🌇', title:'Golden Hour', desc:'Placeholder: The golden hour has a golden surprise…', note:'You glow brighter than any sunset' },
    { time:'8:00 PM', day:10, hour:20, emoji:'🍽️', title:'Evening Elegance', desc:'Placeholder: An elegant evening experience just for you…', note:'Fine dining with the finest person' },
    { time:'10:00 PM', day:10, hour:22, emoji:'🌙', title:'Starlit Night', desc:'Placeholder: The night sky has a secret to share…', note:'Under the stars, with you' },
    // — Night gap 10PM → 7AM —
    { time:'7:00 AM', day:11, hour:7, emoji:'☀️', title:'New Dawn, Still Yours', desc:'Placeholder: A brand new morning filled with love…', note:'Good morning, my everything' }
];

function getUnlockDate(item) {
    return new Date(`2026-07-${String(item.day).padStart(2,'0')}T${String(item.hour).padStart(2,'0')}:00:00`);
}
function isUnlocked(item) { return new Date() >= getUnlockDate(item); }

function timeUntilStr(item) {
    const diff = getUnlockDate(item) - new Date();
    if (diff <= 0) return 'Unlocked';
    const d = Math.floor(diff/864e5);
    const h = Math.floor(diff%864e5/36e5);
    const m = Math.floor(diff%36e5/6e4);
    const s = Math.floor(diff%6e4/1e3);
    if (d > 0) return `${d}d ${h}h ${m}m`;
    if (h > 0) return `${h}h ${m}m ${s}s`;
    return `${m}m ${s}s`;
}

// ============================================
// RENDER
// ============================================
function renderTimeline() {
    const box = document.getElementById('timeline-items');
    box.innerHTML = '';
    let prevDay = null;

    itinerary.forEach((item, i) => {
        // Day label
        if (item.day !== prevDay) {
            // Night block between days
            if (prevDay !== null) {
                const nb = document.createElement('div');
                nb.className = 'night-block';
                nb.innerHTML = `<div class="night-block-inner">
                    <span class="moon">🌜</span>
                    <span class="night-title">Sweet dreams, my love</span>
                    <span class="night-sub">10 PM — 7 AM · Rest &amp; Recharge</span>
                </div>`;
                box.appendChild(nb);
            }
            const dl = document.createElement('div');
            dl.className = 'day-label';
            dl.innerHTML = `<div class="day-label-inner">
                <span class="material-symbols-outlined">calendar_today</span>
                July ${item.day}, 2026
            </div>`;
            box.appendChild(dl);
            prevDay = item.day;
        }

        const unlocked = isUnlocked(item);
        const el = document.createElement('div');
        el.className = 'tl-item';
        el.style.animationDelay = `${i * .08}s`;
        el.id = `tl-${i}`;

        el.innerHTML = `
            <div class="tl-dot ${unlocked ? 'is-unlocked' : 'is-locked'}"></div>
            <div class="tl-card ${unlocked ? 'is-unlocked' : 'is-locked'}">
                ${unlocked ? `
                <div class="card-content">
                    <span class="card-emoji">${item.emoji}</span>
                    <div class="card-time">
                        <span class="material-symbols-outlined">schedule</span>
                        ${item.time}
                    </div>
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-desc">${item.desc}</p>
                    <div class="card-note">
                        <span class="material-symbols-outlined">mail</span>
                        ${item.note}
                    </div>
                </div>` : `
                <div class="card-locked">
                    <div class="lock-icon-wrap">
                        <span class="material-symbols-outlined">lock</span>
                    </div>
                    <div class="lock-msg">This surprise is still locked</div>
                    <div class="lock-timer" data-idx="${i}">Reveals in: ${timeUntilStr(item)}</div>
                    <div class="lock-time-badge">
                        <span class="material-symbols-outlined">schedule</span>
                        ${item.time}
                    </div>
                </div>`}
            </div>`;
        box.appendChild(el);
    });
}

// ============================================
// LIVE UPDATE
// ============================================
let prevUnlockState = itinerary.map(i => isUnlocked(i));

function tick() {
    // Individual countdowns
    itinerary.forEach((item, i) => {
        const el = document.querySelector(`.lock-timer[data-idx="${i}"]`);
        if (el) el.textContent = `Reveals in: ${timeUntilStr(item)}`;
        // Check for newly unlocked
        const now = isUnlocked(item);
        if (now && !prevUnlockState[i]) {
            prevUnlockState[i] = true;
            renderTimeline();
            showToast(`${item.emoji}  ${item.title} has been revealed!`);
        }
    });

    // Header countdown
    const now = new Date();
    const start = new Date('2026-07-10T10:00:00');
    const end   = new Date('2026-07-11T07:00:00');
    const ct = document.getElementById('countdown-timer');
    if (now < start) {
        const d = start - now;
        const dd = Math.floor(d/864e5), hh = Math.floor(d%864e5/36e5), mm = Math.floor(d%36e5/6e4), ss = Math.floor(d%6e4/1e3);
        ct.innerHTML = `Celebration begins in <strong>${dd}d ${hh}h ${mm}m ${ss}s</strong>`;
    } else if (now <= end) {
        ct.innerHTML = `<strong>🎉 Celebration is LIVE! 🎉</strong>`;
    } else {
        ct.innerHTML = `<strong>💖 Hope you loved every moment 💖</strong>`;
    }
}

// ============================================
// TOAST
// ============================================
function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toast-text').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4500);
}

// ============================================
// NAV
// ============================================
function enterPlan() {
    const l = document.getElementById('landing-screen');
    const m = document.getElementById('main-screen');
    l.classList.add('hidden');
    setTimeout(() => { l.style.display = 'none'; m.classList.add('visible'); renderTimeline(); }, 900);
}
function goBack() {
    const l = document.getElementById('landing-screen');
    const m = document.getElementById('main-screen');
    m.classList.remove('visible');
    setTimeout(() => {
        m.style.display = 'none';
        l.style.display = 'flex';
        requestAnimationFrame(() => l.classList.remove('hidden'));
    }, 100);
}

// ============================================
// PARTICLES
// ============================================
function initParticles() {
    const c = document.getElementById('particles-canvas'), ctx = c.getContext('2d');
    let pts = [];
    function resize() { c.width = innerWidth; c.height = innerHeight; }
    resize(); addEventListener('resize', resize);

    class P {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random()*c.width; this.y = Math.random()*c.height;
            this.r = Math.random()*1.5+.4;
            this.dx = (Math.random()-.5)*.3; this.dy = (Math.random()-.5)*.3;
            this.o = Math.random()*.3+.05; this.p = Math.random()*Math.PI*2;
            this.clr = Math.random()>.5 ? '212,70,106' : '201,168,76';
        }
        update() {
            this.x += this.dx; this.y += this.dy; this.p += .015;
            if (this.x<0||this.x>c.width||this.y<0||this.y>c.height) this.reset();
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(${this.clr},${this.o*(.5+Math.sin(this.p)*.5)})`;
            ctx.fill();
        }
    }

    const n = Math.min(70, Math.floor(innerWidth/18));
    for (let i=0;i<n;i++) pts.push(new P());
    (function loop() { ctx.clearRect(0,0,c.width,c.height); pts.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(loop); })();
}

// ============================================
// HEARTS
// ============================================
function initHearts() {
    const box = document.getElementById('landingHearts');
    const h = ['💕','💖','💗','💝','♥️','✨','⭐','💫'];
    for (let i=0;i<18;i++) {
        const d = document.createElement('div');
        d.className = 'floating-heart';
        d.textContent = h[Math.floor(Math.random()*h.length)];
        d.style.left = Math.random()*100+'%';
        d.style.fontSize = (Math.random()*14+10)+'px';
        d.style.animationDuration = (Math.random()*10+8)+'s';
        d.style.animationDelay = (Math.random()*12)+'s';
        box.appendChild(d);
    }
}

// ============================================
// SCROLL PROGRESS
// ============================================
addEventListener('scroll', () => {
    const s = scrollY, h = document.documentElement.scrollHeight - innerHeight;
    document.getElementById('scrollProgress').style.width = (h>0 ? s/h*100 : 0)+'%';
});

// ============================================
// INIT
// ============================================
document.addEventListener('DOMContentLoaded', () => {
    initParticles();
    initHearts();
    setInterval(tick, 1000);
    tick();
});
</script>
</body>
</html>
